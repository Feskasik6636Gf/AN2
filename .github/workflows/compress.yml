name: IYA2D compress
on:
  push:
    paths: ['projects/*/compress.request']
permissions:
  contents: write
  actions: read
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q numpy
      - run: cd engine && npm install --no-audit --no-fund
      - name: take project + run id from request file
        id: r
        run: |
          F=$(git diff --name-only HEAD~1 HEAD | grep -E '^projects/[^/]+/compress.request$' | head -1)
          echo "project=$(echo $F | cut -d/ -f2)" >> $GITHUB_OUTPUT
          echo "run=$(head -1 $F | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: rebuild audio mix (no re-render of frames)
        run: |
          P=${{ steps.r.outputs.project }}
          cd engine && node render.js ../projects/$P --events && python mix.py ../projects/$P
      - name: download final artifact (video)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download ${{ steps.r.outputs.run }} -n final-${{ steps.r.outputs.project }} -D dl
      - name: two-pass encode to <90 MB with the new audio
        run: |
          P=${{ steps.r.outputs.project }}; IN=dl/$P.mp4; A=projects/$P/build/mix.wav
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $IN)
          VB=$(python3 -c "print(int((86e6*8/$D - 128000)/1000))")
          echo "duration $D video kbps $VB"
          ffmpeg -v error -y -i $IN -c:v libx264 -preset slow -b:v ${VB}k -pass 1 -an -f null /dev/null
          mkdir -p renders
          ffmpeg -v error -y -i $IN -i $A -map 0:v -map 1:a -c:v libx264 -preset slow -b:v ${VB}k -pass 2 -pix_fmt yuv420p -c:a aac -b:a 160k -shortest -movflags +faststart renders/$P.mp4
          ls -la renders/$P.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate,channels:format=duration,size -of compact renders/$P.mp4
      - name: commit
        run: |
          P=${{ steps.r.outputs.project }}
          git config user.name "iya2d-render"; git config user.email "actions@users.noreply.github.com"
          git add renders/$P.mp4 && git commit -m "render: $P (new audio mix)" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
